<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activando acceso - MercadoForzado</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#fff159">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff159 0%, #ffc107 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 40px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    
    .icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
    
    h1 {
      font-size: 24px;
      margin-bottom: 10px;
      color: #333;
    }
    
    p {
      color: #666;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    
    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #ffc107;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .error {
      background: #fee;
      border: 1px solid #fcc;
      border-radius: 8px;
      padding: 15px;
      margin-top: 20px;
      color: #c33;
    }
    
    .success {
      background: #efe;
      border: 1px solid #cfc;
      border-radius: 8px;
      padding: 15px;
      margin-top: 20px;
      color: #3c3;
    }

    .install-btn {
      display: none;
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      background: #3483fa;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .install-btn:active { transform: scale(0.98); }

    .continue-link {
      display: none;
      margin-top: 14px;
      font-size: 13px;
      color: #3483fa;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📚</div>
    <h1>Activando acceso...</h1>
    <p>Por favor espera mientras validamos tu código de MercadoForzado.</p>
    <div class="loader"></div>
    <div id="message"></div>
    <button class="install-btn" id="install-btn">📲 Instalar app</button>
    <div class="continue-link" id="continue-link">Continuar sin instalar →</div>
  </div>

  <script>
    /* ================================================
       ACTIVACIÓN - MercadoForzado
       ✅ Compatible Safari iOS (sin módulos ES6)
       =============================================== */
    
    const messageEl = document.getElementById("message");

    // Registra el Service Worker aquí también, para que el navegador
    // reconozca la página como instalable (manifest + SW activo).
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    // Captura el prompt nativo de instalación (Chrome/Edge/Android)
    let deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
    });

    function isStandalone() {
      return window.matchMedia('(display-mode: standalone)').matches ||
             window.navigator.standalone === true;
    }
    function isIOS() {
      return /iphone|ipad|ipod/i.test(navigator.userAgent);
    }

    // Muestra las opciones de instalación tras una activación exitosa.
    // En iOS, Safari solo puede "Agregar a pantalla de inicio" desde la
    // página que se está viendo en ese momento — por eso ahí no mostramos
    // instrucciones aquí, sino que entramos directo a core/, que es quien
    // debe quedar guardado en el ícono y quien pide la instalación allí.
    function showInstallStep() {
      const goToCore = () => window.location.replace("./core/");

      if (isStandalone() || isIOS() || !deferredInstallPrompt) {
        goToCore();
        return;
      }

      const installBtn    = document.getElementById('install-btn');
      const continueLink  = document.getElementById('continue-link');

      installBtn.style.display = 'block';
      installBtn.addEventListener('click', async () => {
        installBtn.disabled = true;
        deferredInstallPrompt.prompt();
        await deferredInstallPrompt.userChoice;
        deferredInstallPrompt = null;
        goToCore();
      });

      continueLink.style.display = 'block';
      continueLink.addEventListener('click', goToCore);
    }

    // Constantes de Supabase
    const SUPABASE_URL = "https://zgatennqbagmyfbpiakr.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpnYXRlbm5xYmFnbXlmYnBpYWtyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEwMTg3NTEsImV4cCI6MjA4NjU5NDc1MX0.5c_IoL3_PM1zwFsuvblkoCoWbP9-4BSaMcIwSasLprw";

    // Generar ID de dispositivo (compatible Safari)
    function getDeviceId() {
      let id = localStorage.getItem("device_id");
      if (!id) {
        id = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
          var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
          return v.toString(16);
        });
        localStorage.setItem("device_id", id);
      }
      return id;
    }

    // Activar licencia
    async function activateLicense(code) {
      const device_id = getDeviceId();
      const res = await fetch(`${SUPABASE_URL}/functions/v1/activate`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        },
        body: JSON.stringify({ code, device_id }),
      });
      return res.json();
    }

    // Guardar sesión
    function saveSession(token) {
      localStorage.setItem("session_token", token);
      localStorage.setItem("last_known_status", "valid");
    }

    // Procesar activación
    const params = new URLSearchParams(window.location.search);
    const code = params.get("k");

    if (!code) {
      // Sin código en la URL: puede ser que el ícono de pantalla de inicio
      // haya guardado esta página (raíz) en vez de core/. Si ya hay una
      // sesión activada previamente, entra directo a la app.
      if (localStorage.getItem("session_token")) {
        window.location.replace("./core/");
      } else {
        document.querySelector('h1').textContent = 'Acceso no válido';
        document.querySelector('p').textContent = 'No se proporcionó un código de activación.';
        document.querySelector('.loader').style.display = 'none';
        document.querySelector('.icon').textContent = '⚠️';
      }
    } else {
      activateLicense(code)
        .then(result => {
          if (result.session_token) {
            // ✅ Activación exitosa
            saveSession(result.session_token);
            document.querySelector('h1').textContent = '¡Activado!';
            document.querySelector('p').textContent = 'Instala la app para que el acceso quede guardado en tu pantalla de inicio.';
            document.querySelector('.loader').style.display = 'none';
            document.querySelector('.icon').textContent = '✅';

            messageEl.className = 'success';
            messageEl.textContent = 'Tu acceso ha sido activado correctamente.';

            showInstallStep();
          } else {
            // ❌ Error en la activación
            document.querySelector('.loader').style.display = 'none';
            document.querySelector('.icon').textContent = '❌';
            
            const mensajes = {
              invalid_code: "El código no existe.",
              revoked: "Este acceso fue revocado.",
              device_mismatch: "Este código ya está activo en otro dispositivo.",
            };
            
            document.querySelector('h1').textContent = 'Error de activación';
            document.querySelector('p').textContent = mensajes[result.error] || "Error de acceso.";
            
            messageEl.className = 'error';
            messageEl.textContent = 'No se pudo activar tu acceso. Contacta al administrador.';
          }
        })
        .catch(error => {
          document.querySelector('.loader').style.display = 'none';
          document.querySelector('.icon').textContent = '⚠️';
          document.querySelector('h1').textContent = 'Error de conexión';
          document.querySelector('p').textContent = 'No se pudo conectar con el servidor.';
          
          messageEl.className = 'error';
          messageEl.textContent = 'Error: ' + error.message;
        });
    }
  </script>
</body>
</html>
